<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b12">
  <meta name="description" content="Kiscvik.com está en construcción. Pronto será el espacio de mis proyectos de software, experimentos y tecnología retro.">
  <meta name="robots" content="noindex">
  <title>Kiscvik — En construcción</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070B12'/%3E%3Cpath d='M8 6h4v8.5L18.5 6H23l-7 9 7.5 11H19l-5.4-8.2-1.6 2V26H8z' fill='%23EEF5FF'/%3E%3Crect x='22' y='22' width='4' height='4' fill='%234CE4FF'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --background: #070b12;
      --text: #eef5ff;
      --muted: #a4b4c8;
      --line: #223247;
      --cyan: #4ce4ff;
      --amber: #ffc86b;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: var(--text);
      background: radial-gradient(ellipse at 80% 40%, #0e1928, transparent 56%), var(--background);
      font-family: Archivo, system-ui, sans-serif;
    }
    .shell {
      width: min(100% - 2 * clamp(20px, 5vw, 72px), 1312px);
      min-height: inherit;
      margin-inline: auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    header, footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 18px;
      padding-block: 18px;
    }
    header { border-bottom: 1px solid var(--line); }
    footer { border-top: 1px solid var(--line); }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .brand img { width: 35px; height: 35px; border: 1px solid var(--line); }
    .domain, .status, .foot-label {
      margin: 0;
      font: 500 .75rem/1.5 var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .domain, .foot-label { color: var(--muted); }
    main {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      align-items: center;
      gap: clamp(28px, 5vw, 78px);
      padding-block: clamp(42px, 7vh, 94px);
    }
    .status {
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
      padding: 8px 12px;
      border: 1px solid #624d2f;
      background: #ffc86b0c;
      color: var(--amber);
    }
    .status::before {
      content: '';
      flex: none;
      width: 7px;
      height: 7px;
      background: currentColor;
      box-shadow: 0 0 10px #ffc86b60;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.85rem, 5.6vw, 5.55rem);
      font-weight: 900;
      line-height: .98;
      letter-spacing: -.074em;
    }
    h1 span { display: block; color: var(--cyan); }
    .intro {
      max-width: 35ch;
      margin: 27px 0 0;
      color: var(--muted);
      font-size: clamp(1.02rem, 1.5vw, 1.28rem);
      line-height: 1.65;
      text-wrap: pretty;
    }
    .art {
      position: relative;
      isolation: isolate;
      min-width: 0;
      aspect-ratio: 1.11;
      margin: 0;
      border: 1px solid var(--line);
      background: #080e19;
    }
    .art img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .art::after {
      position: absolute;
      inset: 0;
      content: '';
      pointer-events: none;
      background:
        linear-gradient(var(--cyan), var(--cyan)) top left / 18px 1px no-repeat,
        linear-gradient(var(--cyan), var(--cyan)) top left / 1px 18px no-repeat,
        linear-gradient(var(--cyan), var(--cyan)) bottom right / 18px 1px no-repeat,
        linear-gradient(var(--cyan), var(--cyan)) bottom right / 1px 18px no-repeat,
        repeating-linear-gradient(0deg, #609fc310 0 1px, transparent 1px 34px),
        repeating-linear-gradient(90deg, #609fc310 0 1px, transparent 1px 34px);
    }
    footer a {
      padding-block: 5px;
      color: var(--text);
      font-size: .92rem;
      font-weight: 600;
      text-underline-offset: 5px;
      text-decoration-color: var(--cyan);
    }
    footer a:hover { color: var(--cyan); }
    a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 5px; }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; padding-block: 38px; }
      h1 { font-size: clamp(2.85rem, 9vw, 4.85rem); }
      .status { margin-bottom: 21px; }
      .intro { margin-top: 19px; }
      .art { aspect-ratio: 1.35; }
    }
  </style>
</head>
